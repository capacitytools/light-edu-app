<!DOCTYPE html>
<html>
<head>
  <title>JS Test</title>
</head>
<body>
  <h1>JavaScript Test</h1>
  <button onclick="alert('JavaScript is WORKING!')">TAP ME</button>
  <p id="status">Loading...</p>
  
  <script>
    document.getElementById('status').innerText = '✅ JavaScript loaded successfully!';
    
    // Test if Supabase library loads
    if (typeof window.supabase !== 'undefined') {
      document.getElementById('status').innerText += '\n✅ Supabase library loaded!';
    } else {
      document.getElementById('status').innerText += '\n❌ Supabase library NOT loaded!';
    }
  </script>
</body>
</html>
