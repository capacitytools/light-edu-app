<!DOCTYPE html>
<html>
<head>
  <title>AI Teacher - Light Edu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #F8FAFC; font-family: Arial, sans-serif; padding-bottom: 140px; }
    
    .header { background: #1E3A8A; color: white; padding: 15px 20px; display: flex; align-items: center; }
    .header-icon { font-size: 28px; margin-right: 10px; }
    .header h1 { font-size: 18px; margin: 0; }
    
    .chat-area { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .message { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .message.ai { background: white; color: #1E293B; align-self: flex-start; border-top-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .message.user { background: #1E3A8A; color: white; align-self: flex-end; border-top-right-radius: 4px; }
    .message.error { background: #FEE2E2; color: #991B1B; align-self: center; font-size: 13px; border: 1px solid #FCA5A5; }
    
    .input-area { position: fixed; bottom: 60px; left: 0; right: 0; background: white; padding: 12px 15px; display: flex; align-items: center; border-top: 1px solid #E2E8F0; }
    .input-area input { flex: 1; padding: 12px; border: 1px solid #E2E8F0; background: #F1F5F9; border-radius: 25px; font-size: 16px; outline: none; }
    .input-area button { background: #DC2626; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; margin-left: 10px; font-size: 20px; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0 15px; border-top: 1px solid #E2E8F0; z-index: 100; }
    .nav-btn { text-align: center; color: #94A3B8; text-decoration: none; font-size: 10px; flex: 1; }
    .nav-btn.active { color: #1E3A8A; font-weight: bold; }
    .nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <h1>Professor LIGHT</h1>
      <div style="font-size: 12px; opacity: 0.8;">● Online • AI Teacher</div>
    </div>
  </div>

  <div class="chat-area" id="chat-box">
    <div class="message ai">
      Hello! I am Professor LIGHT. 🛡️<br>Ask me any question about Math, Science, or your exams!
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Ask a question...">
    <button onclick="sendMessage()">➤</button>
  </div>
  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-btn"><span class="nav-icon">🏠</span>Home</a>
    <a href="learn.html" class="nav-btn"><span class="nav-icon">📚</span>Learn</a>
    <a href="cbt.html" class="nav-btn"><span class="nav-icon"></span>CBT</a>
    <a href="ai.html" class="nav-btn active"><span class="nav-icon">💬</span>AI</a>
    <a href="profile.html" class="nav-btn"><span class="nav-icon"></span>Profile</a>
  </div>

  <script>
    //  STEP 2: PASTE YOUR GROQ API KEY BELOW 👇
    // Make sure there are NO spaces inside the quotes!
    const GROQ_API_KEY = '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'; 
    
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();

      if (text === "") return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = text;
      chatBox.appendChild(userMsg);
      
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const typingMsg = document.createElement('div');
      typingMsg.className = 'message ai';
      typingMsg.innerText = " Professor LIGHT is thinking...";
      chatBox.appendChild(typingMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GROQ_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.1-8b-instant',
            messages: [
              {
                role: 'system',
                content: `You are Professor LIGHT, an expert teacher for Nigerian students preparing for WAEC, NECO, and UTME.

TEACHING STYLE:- Explain concepts SIMPLY, like teaching a 13-year-old.
- Always use REAL-LIFE EXAMPLES from Nigeria (markets, football, phone credit, etc.).
- Break complex topics into STEP-BY-STEP instructions.
- Use SHORT sentences and SIMPLE words.
- If you must use technical terms, DEFINE them immediately.
- Show WORKED EXAMPLES before asking students to try.
- Use emojis to make learning fun 🧮⚛️.
- Be ENCOURAGING and PATIENT.
- Keep answers focused but thorough (not too long, not too short).

RESPONSE FORMAT:
1. Start with a simple definition/explanation.
2. Give a relatable example.
3. Show step-by-step how it works.
4. End with encouragement or a practice tip.

Remember: Your goal is to make difficult topics EASY to understand!`
              },
              { role: 'user', content: text }
            ]
          })
        });

        chatBox.removeChild(typingMsg);

        if (!response.ok) {
          const errorData = await response.json();
          const errorMessage = errorData.error?.message || 'Unknown Error';
          throw new Error(errorMessage);
        }

        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
          const aiMsg = document.createElement('div');
          aiMsg.className = 'message ai';
          aiMsg.innerText = data.choices[0].message.content;
          chatBox.appendChild(aiMsg);
        } else {
          throw new Error('No response from AI');
        }

      } catch (error) {
        console.error('AI Error:', error);
        const errorMsg = document.createElement('div');
        errorMsg.className = 'message error';
        errorMsg.innerHTML = `⚠️ <b>Error:</b><br>${error.message}`;
        chatBox.appendChild(errorMsg);
      }
            chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
