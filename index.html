<!DOCTYPE html>
<html>
<head>
  <title>Light Edu App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1E3A8A">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    body { background-color: #1E3A8A; color: white; font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .logo { width: 140px; height: auto; margin-bottom: 20px; }
    h1 { font-size: 26px; margin: 5px 0; letter-spacing: 1px; }
    h2 { font-size: 16px; margin: 0 0 25px 0; font-weight: normal; color: #E0E7FF; }
    .motto { font-size: 16px; color: #FCA5A5; font-style: italic; margin-bottom: 40px; }
    .button { background-color: #DC2626; color: white; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 18px; font-weight: bold; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    /* POPUP STYLES */
    #install-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
    .popup-content { background: white; color: #1E293B; padding: 25px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .popup-content h2 { color: #1E3A8A; margin-bottom: 10px; font-size: 20px; }
    .popup-content p { color: #64748B; margin-bottom: 20px; font-size: 14px; }
    .install-btn { background: #DC2626; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
    .close-btn { background: transparent; color: #94A3B8; border: none; margin-top: 15px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <img src="logo.jpg" alt="Company Logo" class="logo">
  <h1>LIGHT IN THE LIGHT</h1>
  <h2>EDUCONSULT</h2>
  <p class="motto">...Raising Minds, Building Excellence.</p>
  <a href="login.html" class="button">Get Started</a>

  <!-- AUTOMATIC INSTALL POPUP -->
  <div id="install-popup">
    <div class="popup-content">
      <h2>Install Light Edu App! 📱</h2>
      <p>Get the full app experience on your home screen. No browser needed!</p>
      <button class="install-btn" id="install-btn">Install Now</button>
      <button class="close-btn" id="close-btn">Maybe Later</button>
    </div>
  </div>

  <script>
    // POPUP LOGIC
    let deferredPrompt;
    const popup = document.getElementById('install-popup');
    const installBtn = document.getElementById('install-btn');
    const closeBtn = document.getElementById('close-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      popup.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
      popup.style.display = 'none';
    });

    closeBtn.addEventListener('click', () => { popup.style.display = 'none'; });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/service-worker.js'); });
    }
  </script>
</body>
</html>
